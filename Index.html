<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>To Do List Calendar & LINE OA</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- FullCalendar v6 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
  <?!= HtmlService.createHtmlOutputFromFile('Stylesheet').getContent(); ?>
</head>
<body>

  <!-- Login Container -->
  <div id="login-container" class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
      <h3 class="text-center mb-4"><i class="fas fa-calendar-check text-primary"></i> Login</h3>
      <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="login-user" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="login-pass" class="form-control">
      </div>
      <button class="btn btn-primary w-100" onclick="handleLogin()">Sign In</button>
    </div>
  </div>

  <!-- App Main Layout -->
  <div id="app-container" class="d-none">
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-dark sidebar collapse text-white vh-100 p-3">
          <h4 class="text-center py-3 border-bottom"><i class="fas fa-tasks"></i> ToDo Calendar</h4>
          <ul id="sidebar-menu" class="nav flex-column mt-3">
            <!-- Dynamic Menus injected via JS -->
          </ul>
          <div class="position-absolute bottom-0 start-3 mb-3">
            <button class="btn btn-outline-light btn-sm w-100" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
          </div>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
          
          <!-- Dashboard Section -->
          <div id="dashboard-section" class="content-section">
            <h2>Dashboard</h2>
            <div class="row text-white mt-4">
              <div class="col-md-3 mb-3"><div class="card bg-primary p-3"><h5>Today Tasks</h5><h3 id="count-today">0</h3></div></div>
              <div class="col-md-3 mb-3"><div class="card bg-warning p-3"><h5>Pending / Overdue</h5><h3 id="count-pending">0</h3></div></div>
              <div class="col-md-3 mb-3"><div class="card bg-success p-3"><h5>Completed</h5><h3 id="count-completed">0</h3></div></div>
              <div class="col-md-3 mb-3"><div class="card bg-danger p-3"><h5>High Priority</h5><h3 id="count-high">0</h3></div></div>
            </div>
          </div>

          <!-- Calendar & Tasks Section -->
          <div id="calendar-section" class="content-section d-none">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2>Calendar & Tasks</h2>
              <button class="btn btn-primary" onclick="openTaskModal()"><i class="fas fa-plus"></i> Add New Task</button>
            </div>
            <div id="calendar" class="bg-white p-3 rounded shadow-sm"></div>
          </div>

          <!-- Category Management Section -->
          <div id="category-section" class="content-section d-none">
            <h2>Category Management</h2>
            <p class="text-muted">จัดการหมวดหมู่และสีของแท็กงาน</p>
          </div>

          <!-- Admin Menu Management Section -->
          <div id="admin-section" class="content-section d-none">
            <h2>Menu Management</h2>
            <p class="text-muted">กำหนดรายการเมนูบน Sidebar สำหรับผู้ดูแลระบบ</p>
          </div>

        </main>
      </div>
    </div>
  </div>

  <!-- Task Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Add Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="taskId">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="taskTitle" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="taskDesc" class="form-control" rows="2"></textarea>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Category</label>
              <select id="taskCategory" class="form-select"></select>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Priority</label>
              <select id="taskPriority" class="form-select">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">End Date</label>
              <input type="date" id="taskEndDate" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Due Time</label>
              <input type="time" id="taskDueTime" class="form-control">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Color Tag</label>
            <input type="color" id="taskColor" class="form-control form-control-color" value="#0d6efd">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger d-none" id="btnDeleteTask" onclick="onDeleteTask()">Delete</button>
          <button type="button" class="btn btn-primary" onclick="onSaveTask()">Save Task</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <?!= HtmlService.createHtmlOutputFromFile('Javascript').getContent(); ?>
</body>
</html>
